name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.deleted != true
    uses: ./.github/workflows/ci.yml
  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Check the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; if (`v${JSON.parse(fs.readFileSync("package.json")).version}` !== process.env.RELEASE_TAG) process.exit(1)'
      - run: npm ci
      - name: Build the release archive and checksums
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          cp dist/source.json artifacts/source.json
          cd artifacts
          sha256sum *.tgz source.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: artifacts/*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "Theme Catalogue $RELEASE_TAG" --generate-notes
